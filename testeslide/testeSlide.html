<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Responsivo</title>
    <link rel="stylesheet" href="testeSlide.css">
</head>
<body>
    <div class="main-slider-wrapper">
        <button class="prev-btn">&lt;</button>
        <div class="slider-container">
            <div class="slider-wrapper">
                <div class="card">
                    <img src="https://via.placeholder.com/300x150/FF5733/FFFFFF?text=Imagem+1" alt="Imagem 1">
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/300x150/33FF57/FFFFFF?text=Imagem+2" alt="Imagem 2">
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/300x150/3357FF/FFFFFF?text=Imagem+3" alt="Imagem 3">
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/300x150/FF33CC/FFFFFF?text=Imagem+4" alt="Imagem 4">
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/300x150/FFFF33/333333?text=Imagem+5" alt="Imagem 5">
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/300x150/33FFFF/333333?text=Imagem+6" alt="Imagem 6">
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/300x150/CC33FF/FFFFFF?text=Imagem+7" alt="Imagem 7">
                </div>
                <div class="card">
                    <img src="https://via.placeholder.com/300x150/33CCFF/FFFFFF?text=Imagem+8" alt="Imagem 8">
                </div>
                </div>
        </div>
        <button class="next-btn">&gt;</button>
    </div>
    <script src="testeSlide.js"></script>
</body>
</html>
